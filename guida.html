<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guida</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guida">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="guida-icon.png">
<style>
:root{color-scheme:light dark;--bg:#fafaf8;--tx:#111;--mu:#8a8a85;--bd:#e8e8e4;--rd:#b3261e;--gr:#2e7d4f;--yl:#c99700}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e0e;--tx:#ededea;--mu:#7d7d78;--bd:#242422;--rd:#e5776f;--gr:#6fc08f;--yl:#e6b422}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.4 -apple-system,system-ui,Helvetica,Arial,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 90px)}
.card{padding:0 0 28px;margin:0 0 28px;border-bottom:1px solid var(--bd)}
.card:last-child{border:0}
h2{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--mu);margin:0 0 16px}
.big{font-size:46px;font-weight:200;letter-spacing:-.03em;line-height:1.1;margin:4px 0}
.mu{color:var(--mu);font-size:13px}
.bad{color:var(--rd)}.ok{color:var(--gr)}.wn{color:var(--yl)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px}
.g b{display:block;font-size:26px;font-weight:300;letter-spacing:-.02em;line-height:1.2}
.g span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:0 0 28px}
.nav b{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
button,select,input{font:inherit;color:var(--tx)}
.btn{background:var(--tx);color:var(--bg);border:0;border-radius:8px;padding:14px;width:100%;font-size:14px;font-weight:500;letter-spacing:.04em;margin-top:20px}
.btn.s{background:none;color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:none;color:var(--rd);border:1px solid var(--bd)}
.ib{background:none;border:0;font-size:24px;font-weight:200;color:var(--mu);padding:4px 10px;margin:0 -10px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:20px 0 2px}
input,select{width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:none;font-size:17px;-webkit-appearance:none;appearance:none;outline:0}
input:focus,select:focus{border-bottom-color:var(--tx)}
input[type=checkbox]{width:20px;height:20px;padding:0;-webkit-appearance:checkbox;appearance:auto;margin:0 10px 0 0;vertical-align:middle}
.ck{display:flex;align-items:center;margin-top:18px;font-size:15px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);align-items:center}
.row:last-child{border:0}
.row .l{min-width:0}.row .r{white-space:nowrap;text-align:right}
.tap{cursor:pointer}
.bar{height:3px;background:var(--bd);margin-top:6px}
.bar i{display:block;height:100%;background:var(--tx)}
.bar i.bad{background:var(--rd)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;padding:16px 0;color:var(--mu);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.tabs button.on{color:var(--tx)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
.hid{display:none}
</style></head><body>
<div id="v-giorni"></div><div id="v-guida" class="hid"></div><div id="v-mese" class="hid"></div><div id="v-altro" class="hid"></div><div id="v-dati" class="hid"></div>
<div id="toast"></div>
<div class="tabs"><button data-t="giorni" class="on">Giorni</button><button data-t="guida">Guida</button><button data-t="mese">Mese</button><button data-t="altro">Altro</button><button data-t="dati">Dati</button></div>
<script>
var MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
var GG=['','lun','mar','mer','gio','ven','sab','dom'];
var TIPI=['Eccesso di velocità','Guida senza scheda tachigrafica','Superamento limiti di guida','Pausa di 45 minuti violata','Altra infrazione'];
var KEY='guida_v2',db={g:[],v:[],mr:[],inf:[],s:{h168:168,notti:64,scad:56,prev:7,pm:30}};
function norm(x){if(x&&x.g&&!Array.isArray(x.g)){x.g=Object.keys(x.g).sort().map(function(d,i){var e=x.g[d];e.d=d;e.id=e.id||(i+1);return e})}
 if(x&&Array.isArray(x.g)){x.v=Array.isArray(x.v)?x.v:[];x.mr=Array.isArray(x.mr)?x.mr:[];if(x.s&&x.s.pm==null)x.s.pm=30;
  x.g.forEach(function(e){if(e.ty==null){var tx=(e.t||'')+' '+(e.p||'');e.ty=/fermo\s*aziendale/i.test(tx)?'f':/ferie/i.test(tx)?'v':'';if(e.ty){e.t='';e.p=''}}if(e.tr==null)e.tr='';if(e.t)e.t=String(e.t).trim().toUpperCase()})}
 return x}
function vOpts(k,sel){var l=db.v.filter(function(m){return m.k===k}).map(function(m){return m.t}).sort();if(sel&&l.indexOf(sel)<0)l.push(sel);return '<option value="">— nessuno —</option>'+l.map(function(t){return '<option>'+esc(t)+'</option>'}).join('')}
function mOpts(sel){var l=db.mr.map(function(m){return m.n}).sort();if(sel&&l.indexOf(sel)<0)l.push(sel);return '<option value="">— nessuna —</option>'+l.map(function(t){return '<option>'+esc(t)+'</option>'}).join('')}
function vleft(d){return d?dn(d)-dn(today()):null}
function valerts(){var a=[],pm=+db.s.pm||30;db.v.forEach(function(m){[['rev','Revisione'],['ass','Assicurazione']].forEach(function(p){var l=vleft(m[p[0]]);if(l!=null&&l<=pm)a.push({t:m.t,w:p[1],l:l})})});return a.sort(function(x,y){return x.l-y.l})}
try{var raw=localStorage.getItem(KEY);if(raw){var x0=JSON.parse(raw);x0=norm(x0);if(x0&&Array.isArray(x0.g)&&x0.inf&&x0.s)db=x0}}catch(e){}
var $=function(s){return document.querySelector(s)};
var ui={form:false,ed:null,inf:false,ied:null,vf:false,ved:null,mf:false,mred:null,tab:'giorni'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Salvataggio non riuscito: fai un backup')}}
function toast(t){var e=$('#toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},2600)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nf(n,d){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d})}
function pad(n){return String(n).padStart(2,'0')}
function th(s){if(!s)return null;var a=s.split(':');return(+a[0])+(+a[1]||0)/60+(+a[2]||0)/3600}
function worked(e){var a=th(e.i),b=th(e.o);if(a==null||b==null)return null;var h=b-a;if(h<0)h+=24;return h}
function gm(e){var m=/^(\d{1,2}):(\d{2})$/.exec((e.gd||'').trim());return m?(+m[1])*60+(+m[2]):0}
function hm(m){m=Math.round(m);return Math.floor(m/60)+':'+pad(m%60)}
function hrs(h){return hm(h*60)}
function dn(s){var a=s.split('-');return Date.UTC(+a[0],+a[1]-1,+a[2])/864e5}
function fromDn(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function wd(s){return((new Date(dn(s)*864e5).getUTCDay()+6)%7)+1}
function dm(s){return s.slice(8)+'/'+s.slice(5,7)}
function dmy(s){return dm(s)+'/'+s.slice(0,4)}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var cur=today().slice(0,7);
function shift(k,n){var y=+k.slice(0,4),m=+k.slice(5)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad(m+1)}
function mlabel(k){return MESI[+k.slice(5)-1]+' '+k.slice(0,4)}
function nav(){return '<div class="nav"><button class="ib" data-m="-1">‹</button><b>'+mlabel(cur)+'</b><button class="ib" data-m="1">›</button></div>'}
function entsOf(k){return db.g.filter(function(e){return e.d.indexOf(k)===0}).sort(function(a,b){return a.d.localeCompare(b.d)||(a.i||'').localeCompare(b.i||'')})}
function byId(id){return db.g.filter(function(e){return e.id===id})[0]}
function ov(a,b,c,d){return Math.max(0,Math.min(b,d)-Math.max(a,c))}
function us(e){var w=worked(e);if(w==null)return null;var s=th(e.i),t=s+w,F=ov(s,t,0,5)+ov(s,t,24,29);return{F:F,t:(w>=6-1e-9&&F>=5-1e-9)?1:0,f:F>=3-1e-9?1:0}}
function gsum(a,b){var s=0;db.g.forEach(function(e){var n=dn(e.d);if(n>=a&&n<=b)s+=gm(e)});return s}
function mstats(k){var o={ore:0,nf:0,sab:0,gl:0,km:0,tu:0,fi:0,fa:0,g:0,fm:0,fe:0},seen={},sf={};entsOf(k).forEach(function(e){if(e.ty){if(!sf[e.d+e.ty]){sf[e.d+e.ty]=1;if(e.ty==='f')o.fm++;else o.fe++}return}var w=worked(e),u=us(e);if(e.nf)o.nf++;o.km+=+e.k||0;o.g+=gm(e);if(w!=null&&w>0){o.ore+=w;if(!seen[e.d]){seen[e.d]=1;o.gl++;if(wd(e.d)===6)o.sab++}}if(u){o.tu+=u.t;o.fi+=u.f;o.fa+=u.F}});return o}

/* ---- GIORNI ---- */
function dayRow(e){var w=worked(e),dest=e.ty==='f'?'Fermo aziendale':e.ty==='v'?'Ferie':e.a?e.a+(e.z?' · '+e.z:''):(e.p||'—');
 var pl=e.t?e.t+(e.tr?' + '+e.tr:''):'';var l2=w!=null?(pl?pl+' · ':'')+e.i.slice(0,5)+'–'+e.o.slice(0,5)+(e.gd?' · guida '+e.gd:'')+(e.nf?' · notte fuori':''):(e.nf?'notte fuori':'');
 if(e.ty)l2=e.n||'';
 return '<div class="row tap" data-ed="'+e.id+'"><div class="l"><div>'+dm(e.d)+' '+GG[wd(e.d)]+' · '+esc(dest)+(e.pr?' <span class="bad">●</span>':'')+'</div>'+(l2?'<div class="mu">'+l2+'</div>':'')+'</div><div class="r">'+(w!=null?hrs(w):'')+'</div></div>'}
function formDay(){var e=ui.ed!=null?(byId(ui.ed)||{}):{},sp=!!e.ty;
 return '<div class="card"><h2>'+(ui.ed!=null?'Modifica giorno':'Nuovo giorno')+'</h2><label>Data</label><input id="fd" type="date"><label>Tipo di giorno</label><select id="fy"><option value="">Lavoro</option><option value="f">Fermo aziendale</option><option value="v">Ferie</option></select><div id="wf" class="'+(sp?'hid':'')+'"><label>Camion (targa)</label><select id="ft">'+vOpts('c',e.t)+'</select><label>Rimorchio (targa)</label><select id="ftr">'+vOpts('r',e.tr)+'</select><div class="mu" style="margin-top:8px">Camion e rimorchi si aggiungono dalla scheda Altro, sezione Mezzi.</div><label>Partenza</label><input id="fp"><label>Arrivo</label><input id="fa"><label>Tipologia merce</label><select id="fm">'+mOpts(e.m)+'</select><label>Azienda (ritorno scarico/carico)</label><input id="fz"><label>Km</label><input id="fk" inputmode="numeric"><label>Ora entrata</label><input id="fi" type="time" step="1"><label>Ora uscita</label><input id="fo" type="time" step="1"><label>Guida giornaliera (h:mm)</label><input id="fgd" placeholder="es. 8:09"><label>Spesa lavorativa (€)</label><input id="fsp" inputmode="decimal"><div class="ck"><input id="fnf" type="checkbox"><span>Notte fuori</span></div><div class="ck"><input id="fpr" type="checkbox"><span>Azienda problematica</span></div></div><label>Note</label><input id="fn"><button class="btn" id="sg">Salva</button>'+(ui.ed!=null?'<button class="btn d" id="dg">Elimina</button>':'')+'<button class="btn s" id="cg">Annulla</button></div>'}
function fillDay(){var e=ui.ed!=null?byId(ui.ed):{d:ui.fd};e=e||{d:ui.fd};$('#fd').value=e.d||ui.fd;[['ty','fy'],['t','ft'],['tr','ftr'],['p','fp'],['a','fa'],['m','fm'],['z','fz'],['k','fk'],['i','fi'],['o','fo'],['gd','fgd'],['sp','fsp'],['n','fn']].forEach(function(p){$('#'+p[1]).value=e[p[0]]==null?'':e[p[0]]});$('#fnf').checked=!!e.nf;$('#fpr').checked=!!e.pr}
function renderGiorni(){var ks=entsOf(cur),st=mstats(cur),h=nav();
 var al=valerts();if(al.length)h+='<div class="card"><h2>Scadenze mezzi</h2>'+al.map(function(x){return'<div class="row"><span>'+esc(x.t)+' · '+x.w+'</span><span class="'+(x.l<0?'bad':'wn')+'">'+(x.l<0?'scaduta da '+(-x.l)+' giorni':x.l===0?'scade oggi':'tra '+x.l+' giorni')+'</span></div>'}).join('')+'</div>';
 h+='<div class="card"><div class="g"><div><b>'+st.gl+'</b><span>giorni lavorati</span></div><div><b>'+hrs(st.ore)+'</b><span>ore lavorate</span></div>'+(st.fm||st.fe?'<div><b>'+st.fm+'</b><span>fermo aziendale</span></div><div><b>'+st.fe+'</b><span>ferie</span></div>':'')+'</div>'+(ui.form?'':'<button class="btn" id="ng">+ Giorno</button>')+'</div>';
 if(ui.form)h+=formDay();
 h+='<div class="card"><h2>Registro ('+ks.length+')</h2>';
 if(!ks.length)h+='<div class="mu">Nessun giorno registrato in questo mese.</div>';
 ks.slice().reverse().forEach(function(e){h+=dayRow(e)});
 $('#v-giorni').innerHTML=h+'</div>';
 if(ui.form)fillDay()}

/* ---- GUIDA ---- */
function renderGuida(){var ks=entsOf(cur),h=nav(),tg=0,tw=0,days={};
 ks.forEach(function(e){var w=worked(e),o=days[e.d]||(days[e.d]={g:0,w:0,i:null,o:null});tg+=gm(e);o.g+=gm(e);if(w!=null){tw+=w;o.w+=w}if(e.i&&(o.i==null||e.i<o.i))o.i=e.i;if(e.o)o.o=e.o});
 h+='<div class="card"><div class="mu">Guida del mese</div><div class="big">'+hm(tg)+'</div><div class="mu">su '+hrs(tw)+' ore lavorate'+(tw>0&&tg>0?' ('+Math.round(tg/60/tw*100)+'% guida)':'')+'</div></div>';
 var first=dn(cur+'-01'),last=dn(shift(cur,1)+'-01')-1,mon=first-wd(cur+'-01')+1,wk='';
 for(var n=mon;n<=last;n+=7){var s=gsum(n,n+6);if(!s)continue;var b=gsum(n-7,n+6),ws=s>3360,wb=b>5400;
  wk+='<div style="margin-bottom:18px"><div class="row" style="border:0;padding:0"><span>'+dm(fromDn(n))+' – '+dm(fromDn(n+6))+'</span><span class="'+(ws?'bad':'')+'">'+hm(s)+' / 56:00</span></div><div class="bar"><i class="'+(ws?'bad':'')+'" style="width:'+Math.min(100,s/3360*100)+'%"></i></div><div class="row" style="border:0;padding:6px 0 0"><span class="mu">2 settimane</span><span class="mu '+(wb?'bad':'')+'">'+hm(b)+' / 90:00'+(ws?' · SUPERATA 56 h':'')+(wb?' · SUPERATA 90 h':'')+'</span></div></div>'}
 h+='<div class="card"><h2>Settimane (lun–dom)</h2>'+(wk||'<div class="mu">Nessuna guida inserita.</div>')+'</div>';
 h+='<div class="card"><h2>Giorni con guida</h2>';var any=false;
 Object.keys(days).sort().reverse().forEach(function(k){var o=days[k],g=o.g;if(!g)return;any=true;var m0=dn(k)-wd(k)+1,c10=0;for(var i=0;i<7;i++){if(gsum(m0+i,m0+i)>540)c10++}
  var es=g>600?'<span class="bad">oltre 10 h</span>':g>540?(c10>2?'<span class="bad">10 h: '+c10+' volte nella settimana</span>':'10 h ('+c10+'/2 nella settimana)'):'<span class="ok">entro 9 h</span>';
  h+='<div class="row"><div class="l"><div>'+dm(k)+' '+GG[wd(k)]+' · '+hm(g)+'</div><div class="mu">'+(o.w>0?'su '+hrs(o.w)+' lavorate · '+Math.round(g/60/o.w*100)+'% · entrata '+o.i.slice(0,5)+(o.o?' · uscita '+o.o.slice(0,5):''):'orari non inseriti')+'</div></div><div class="r mu">'+es+'</div></div>'});
 if(!any)h+='<div class="mu">Nessuna guida inserita.</div>';
 h+='</div><div class="mu">Controllo orientativo dei soli tempi di guida inseriti: non verifica pause, riposi, guida continuativa o deroghe. Controlla sempre con il tachigrafo.</div>';
 $('#v-guida').innerHTML=h}

/* ---- MESE ---- */
function renderMese(){var st=mstats(cur),h=nav(),T=db.s.h168,ecc=Math.max(0,st.ore-T),yr=cur.slice(0,4);
 h+='<div class="card"><div class="mu">Ore lavorate</div><div class="big'+(ecc>0?' bad':'')+'">'+hrs(st.ore)+'</div><div class="bar"><i class="'+(ecc>0?'bad':'')+'" style="width:'+Math.min(100,st.ore/T*100)+'%"></i></div><div class="mu" style="margin-top:8px">'+(ecc>0?'<span class="bad">SUPERATA: '+hrs(ecc)+' oltre le '+T+' ore</span>':'Entro la soglia di '+T+' ore (restano '+hrs(T-st.ore)+')')+'</div>';
 h+='<div class="g" style="margin-top:22px"><div><b>'+st.nf+'</b><span>notti fuori</span></div><div><b>'+st.sab+'</b><span>sabati lavorati</span></div><div><b>'+st.gl+'</b><span>giorni lavorati</span></div><div><b>'+nf(st.km,0)+'</b><span>km</span></div><div><b>'+st.fm+'</b><span>fermo aziendale</span></div><div><b>'+st.fe+'</b><span>ferie</span></div></div><button class="btn s" id="pdf">Genera PDF del mese</button></div>';
 h+='<div class="card"><h2>Tempo usurante · '+mlabel(cur)+'</h2><div class="g"><div><b>'+st.tu+'</b><span>notti a turni</span></div><div><b>'+st.fi+'</b><span>notti fisse</span></div><div><b>'+hrs(st.fa)+'</b><span>ore 00–05</span></div></div></div>';
 var yt=0,rows='';
 for(var m=1;m<=12;m++){var k=yr+'-'+pad(m),s2=mstats(k);yt+=s2.tu;if(!entsOf(k).length)continue;var e2=Math.max(0,s2.ore-T);rows+='<div class="row"><span>'+MESI[m-1]+'</span><span class="'+(e2>0?'bad':'')+'">'+hrs(s2.ore)+' · '+s2.nf+' notti · '+s2.tu+' usur.</span></div>'}
 var N=db.s.notti;
 h+='<div class="card"><h2>Notti usuranti a turni · '+yr+'</h2><div class="big">'+yt+' <span style="font-size:20px;color:var(--mu)">/ '+N+'</span></div><div class="bar"><i style="width:'+Math.min(100,yt/N*100)+'%"></i></div><div class="mu" style="margin-top:8px">'+(yt>=N?'<span class="ok">SOGLIA RAGGIUNTA</span>':'Mancano '+(N-yt)+' notti alla soglia')+'</div><div class="mu" style="margin-top:6px">Notte a turni: almeno 6 ore consecutive di lavoro e 5 ore nella fascia 00:00–05:00. Notte fissa: almeno 3 ore nella fascia.</div></div>';
 h+='<div class="card"><h2>Mesi del '+yr+'</h2>'+(rows||'<div class="mu">Nessun dato.</div>')+'</div>';
 $('#v-mese').innerHTML=h}

/* ---- ALTRO: infrazioni e aziende ---- */
function infst(x){var left=(x.sc?dn(x.sc):dn(x.d)+db.s.scad)-dn(today()),st=x.ch?'CHIUSA':left<0?'SCADUTA':left<=db.s.prev?'IN SCADENZA':'APERTA';return{st:st,left:left,sc:fromDn(x.sc?dn(x.sc):dn(x.d)+db.s.scad)}}

  if(old)old.n=nm;else db.mr.push({id:Date.now(),n:nm});save();ui.mf=false;ui.mred=null;renderAltro();return toast('Salvato ✓')}
 if(t.id==='pdf'){if(!entsOf(cur).length&&!db.inf.some(function(x){return !x.ch}))return toast('Niente da stampare');return dl('Lavoro_'+cur+'.pdf','application/pdf',makePDF(cur))}
 if(t.id==='nv'){ui.vf=true;ui.ved=null;return renderAltro()}
 if(t.id==='cv'){ui.vf=false;ui.ved=null;return renderAltro()}
 if(t.id==='dv'){if(confirm('Eliminare questo mezzo? I giorni già registrati mantengono la targa.')){db.v=db.v.filter(function(m){return m.id!==ui.ved});save();ui.vf=false;ui.ved=null;renderAltro()}return}
 if(t.id==='sv'){var tg=$('#vt').value.trim().toUpperCase().replace(/\s+/g,'');if(!tg)return toast('Scrivi la targa');
  var mm={id:ui.ved!=null?ui.ved:Date.now(),k:$('#vk').value,t:tg,rev:$('#vr').value,ass:$('#va').value,n:$('#vn').value.trim()};
  if(db.v.some(function(x){return x.t===tg&&x.k===mm.k&&x.id!==mm.id}))return toast('Questa targa esiste già');
  db.v=db.v.filter(function(x){return x.id!==mm.id});db.v.push(mm);save();ui.vf=false;ui.ved=null;renderAltro();return toast('Mezzo salvato ✓')}
 if(t.id==='ni'){ui.inf=true;ui.ied=null;return renderAltro()}
 if(t.id==='ci'){ui.inf=false;ui.ied=null;return renderAltro()}
 if(t.id==='di'){if(confirm('Eliminare questa infrazione?')){db.inf=db.inf.filter(function(i){return i.id!==ui.ied});save();ui.inf=false;ui.ied=null;renderAltro()}return}
 if(t.id==='si'){var d2=$('#xd').value;if(!d2)return toast('Scegli la data');
  var x={id:ui.ied!=null?ui.ied:Date.now(),d:d2,tp:$('#xt').value,lu:$('#xl').value.trim(),v:nv('xv'),li:nv('xi'),to:nv('xo'),pt:nv('xp'),sc:$('#xs').value,ch:$('#xc').checked,n:$('#xn').value.trim()};
  db.inf=db.inf.filter(function(i){return i.id!==x.id});db.inf.push(x);save();ui.inf=false;ui.ied=null;renderAltro();return toast('Infrazione salvata ✓')}
 if(t.id==='ss'){var a=[1,2,3,4,5].map(function(i){return parseFloat($('#s'+i).value.replace(',','.'))});if(a.some(function(v){return !(v>=0)}))return toast('Controlla i valori');db.s={h168:a[0],notti:a[1],scad:a[2],prev:a[3],pm:a[4]};save();return toast('Soglie salvate ✓')}
 if(t.id==='ex')return dl('backup_guida_'+today()+'.json','application/json',new Uint8Array(new TextEncoder().encode(JSON.stringify(db))));
 if(t.id==='im')return $('#fi2').click();
 if(t.id==='rs'&&confirm('Cancellare TUTTI i dati? Non si può annullare.')){db={g:[],v:[],mr:[],inf:[],s:db.s};save();renderDati()}
});
document.addEventListener('change',function(e){
 if(e.target.id==='fy'){$('#wf').className=e.target.value?'hid':'';return}
 if(e.target.id!=='fi2')return;var f=e.target.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){try{var x=norm(JSON.parse(r.result));if(!Array.isArray(x.g)||!x.inf||!x.s)throw 0;if(confirm('Sostituire i dati attuali con il backup ('+x.g.length+' viaggi)?')){db=x;save();renderDati();toast('Backup ripristinato')}}catch(er){toast('File non valido')}};r.readAsText(f);e.target.value='';
});
renderGiorni();
